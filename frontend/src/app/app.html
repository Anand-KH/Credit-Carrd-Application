@if (isSignedIn()) {
  <mat-sidenav-container class="shell">
    <mat-sidenav #sidenav mode="over" role="navigation" aria-label="Main navigation">
      <div class="drawer-brand"><span class="brand-mark">C</span><strong>CrediCard</strong></div>
      <mat-nav-list>
        @for (item of navigation(); track item.path) {
          <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }" (click)="sidenav.close()">
            <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <mat-toolbar class="topbar">
        <button mat-icon-button type="button" aria-label="Open navigation menu" (click)="sidenav.open()">
          <mat-icon>menu</mat-icon>
        </button>
        <a class="brand" routerLink="/dashboard" aria-label="Credit card portal home">
          <span class="brand-mark">C</span><span>CrediCard</span>
        </a>
        <span class="toolbar-spacer"></span>
        @if (authService.currentUser(); as user) {
          <button mat-button class="user-menu-trigger" type="button" [matMenuTriggerFor]="userMenu" aria-label="Open user menu">
            <mat-icon aria-hidden="true">account_circle</mat-icon><span>{{ user.name }}</span>
          </button>
          <mat-menu #userMenu="matMenu">
            <div class="menu-user" mat-menu-item disabled>{{ user.email }} · {{ user.role }}</div>
            <button mat-menu-item type="button" (click)="logout()"><mat-icon>logout</mat-icon><span>Sign out</span></button>
          </mat-menu>
        }
      </mat-toolbar>
      <main class="content"><router-outlet /></main>
    </mat-sidenav-content>
  </mat-sidenav-container>
} @else {
  <div class="public-shell">
    <header class="public-header">
      <a class="brand" routerLink="/login" aria-label="Credit card portal home">
        <span class="brand-mark">C</span><span>CrediCard</span>
      </a>
    </header>
    <main class="public-content"><router-outlet /></main>
  </div>
}
